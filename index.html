{title:'Besuch im Naturkundemuseum',icon:'🦋',facts:[['Wer?','Klasse 4b mit ihrer Lehrerin Frau Winter'],['Wann?','Dienstag, 14. April 2026, 9:00 bis 11:30 Uhr'],['Wo?','Naturkundemuseum am Stadtpark (erfundener Ort)'],['Was?','Führung zum Thema „Tiere der Nacht“'],['Wie?','9:00 Uhr: Ankunft und Begrüßung; Museumsführerin zeigt Fledermausmodelle; Kinder betrachten Spuren von Waldtieren; in Gruppen Tierstimmen erraten; zum Schluss Fragen stellen; 11:30 Uhr: Rückweg zur Schule'],['Ergebnis?','Kinder lernten verschiedene nachtaktive Tiere kennen; viele Fragen konnten beantwortet werden; gelungener Ausflug']],sample:'Ausflug der Klasse 4b ins Naturkundemuseum\n\nAm Dienstag, den 14. April 2026, besuchte die Klasse 4b mit ihrer Lehrerin Frau Winter von 9:00 bis 11:30 Uhr das Naturkundemuseum am Stadtpark. Dort nahm sie an einer Führung zum Thema „Tiere der Nacht“ teil.\n\nUm 9:00 Uhr kam die Klasse im Museum an. Zunächst begrüßte eine Museumsführerin die Kinder und zeigte ihnen verschiedene Fledermausmodelle. Anschließend betrachteten die Schülerinnen und Schüler Spuren von Waldtieren. Danach versuchten sie in kleinen Gruppen, unterschiedliche Tierstimmen zu erkennen. Zum Schluss stellten die Kinder der Museumsführerin ihre Fragen. Um 11:30 Uhr machte sich die Klasse auf den Rückweg zur Schule.\n\nDie Kinder lernten bei der Führung verschiedene nachtaktive Tiere kennen und erhielten Antworten auf viele Fragen. Der Ausflug war gelungen, weil die Klasse viel über die Tiere erfuhr und selbst aktiv werden durfte.'},
{title:'Ein Schulfest mit Mitmachstationen',icon:'🎈',facts:[['Wer?','Alle Kinder der Grundschule, Lehrkräfte und Familien; Organisation durch Elternbeirat und Schule'],['Wann?','Freitag, 19. Juni 2026, 15:00 bis 18:00 Uhr'],['Wo?','Pausenhof der Grundschule am Birkenweg (erfundene Schule)'],['Was?','Schulfest mit Spiel- und Bastelstationen'],['Wie?','Begrüßung um 15 Uhr; Dosenwerfen und Geschicklichkeitsparcours; Bastelstation; Kuchen und Getränke; gemeinsames Abschlusslied um 17:45 Uhr'],['Ergebnis?','Viele Familien nahmen teil; die Stationen wurden rege genutzt; gelungenes Fest']],sample:'Schulfest an der Grundschule am Birkenweg\n\nAm Freitag, den 19. Juni 2026, fand von 15:00 bis 18:00 Uhr auf dem Pausenhof der Grundschule am Birkenweg ein Schulfest statt. Der Elternbeirat und die Schule organisierten die Veranstaltung für die Kinder und ihre Familien.\n\nUm 15 Uhr begrüßte die Schulleitung die Gäste. Danach konnten die Besucher verschiedene Stationen ausprobieren. Einige Kinder warfen Dosen um, während andere einen Geschicklichkeitsparcours durchliefen. An einer weiteren Station bastelten die Schülerinnen und Schüler kleine Anhänger. Zwischendurch kauften die Gäste Kuchen und Getränke. Um 17:45 Uhr sangen alle gemeinsam ein Abschlusslied. Das Fest endete um 18 Uhr.\n\nViele Familien besuchten das Schulfest und nutzten die Mitmachstationen. Insgesamt war die Veranstaltung gelungen, weil die Kinder gemeinsam mit ihren Familien abwechslungsreiche Angebote erleben konnten.'},
{title:'Ein Vormittag bei der Feuerwehr',icon:'🚒',facts:[['Wer?','Klasse 3a und Klassenlehrer Herr Berger'],['Wann?','Mittwoch, 7. Oktober 2026, 8:30 bis 11:00 Uhr'],['Wo?','Feuerwache Nordstadt (erfundener Ort)'],['Was?','Besichtigung der Feuerwache'],['Wie?','Begrüßung durch Feuerwehrfrau; Schutzkleidung ansehen; Löschfahrzeug besichtigen; Ausrüstung erklärt bekommen; Wasserschlauch ausprobieren; Fragen stellen'],['Ergebnis?','Kinder erfuhren viel über die Aufgaben der Feuerwehr; gelungener Besuch']],sample:'Die Klasse 3a besuchte die Feuerwehr\n\nAm Mittwoch, den 7. Oktober 2026, besuchte die Klasse 3a mit ihrem Klassenlehrer Herrn Berger von 8:30 bis 11:00 Uhr die Feuerwache Nordstadt. Die Kinder wollten mehr über die Arbeit der Feuerwehr erfahren.\n\nZu Beginn begrüßte eine Feuerwehrfrau die Klasse. Zuerst zeigte sie den Kindern die Schutzkleidung. Danach durften sie ein großes Löschfahrzeug besichtigen. Die Feuerwehrfrau erklärte die verschiedenen Geräte und beantwortete Fragen. Anschließend probierten die Schülerinnen und Schüler unter Aufsicht einen Wasserschlauch aus. Zum Schluss bedankte sich die Klasse und verabschiedete sich.\n\nDie Kinder lernten viele Aufgaben und Geräte der Feuerwehr kennen. Der Besuch war gelungen, weil die Schülerinnen und Schüler wichtige Informationen erhielten und sogar einen Wasserschlauch ausprobieren durften.'}

const verbData=[['gehen','ging','unregelmäßig'],['kommen','kam','unregelmäßig'],['sehen','sah','unregelmäßig'],['geben','gab','unregelmäßig'],['nehmen','nahm','unregelmäßig'],['finden','fand','unregelmäßig'],['beginnen','begann','unregelmäßig'],['singen','sang','unregelmäßig'],['lesen','las','unregelmäßig'],['essen','aß','unregelmäßig'],['trinken','trank','unregelmäßig'],['fahren','fuhr','unregelmäßig'],['laufen','lief','unregelmäßig'],['schreiben','schrieb','unregelmäßig'],['sprechen','sprach','unregelmäßig'],['helfen','half','unregelmäßig'],['bleiben','blieb','unregelmäßig'],['stehen','stand','unregelmäßig'],['sitzen','saß','unregelmäßig'],['bringen','brachte','gemischt'],['denken','dachte','gemischt'],['besuchen','besuchte','regelmäßig'],['spielen','spielte','regelmäßig'],['fragen','fragte','regelmäßig'],['lernen','lernte','regelmäßig'],['zeigen','zeigte','regelmäßig'],['machen','machte','regelmäßig'],['malen','malte','regelmäßig'],['sammeln','sammelte','regelmäßig'],['erklären','erklärte','regelmäßig'],['warten','wartete','regelmäßig'],['arbeiten','arbeitete','regelmäßig'],['begrüßen','begrüßte','regelmäßig'],['beobachten','beobachtete','regelmäßig'],['applaudieren','applaudierte','regelmäßig'],['erzählen','erzählte','regelmäßig'],['kaufen','kaufte','regelmäßig'],['verkaufen','verkaufte','regelmäßig'],['bauen','baute','regelmäßig'],['feiern','feierte','regelmäßig']];
const types=[['w','🔎','W-Fragen-Detektive','W-Fragen beantworten und Textstellen farbig markieren.'],['order','🧵','Der rote Faden','Ereignisse in die richtige Reihenfolge bringen.'],['improve','✏️','Schreibprofi','Sätze sachlich, genau und richtig formulieren.'],['connect','🐻','Satzverbindungs-Werkstatt','Bindewort auswählen und einen richtigen Satz schreiben.'],['verbs','⏳','Präteritum-Profi','Regelmäßige und unregelmäßige Verben üben.'],['write','📝','Mein eigener Bericht','Freiwillige Schreibaufgabe auf einem Blockblatt.']];
const colors={'Wer?':'#bfffaa','Wann?':'#fff273','Wo?':'#9ab9ff','Was?':'#ffac81','Wie?':'#dedede','Ergebnis?':'#ffffff'};
let phase='word',typed='',markTask=null,markSelected={},markColor='Wer?',markTry=0,verbInput='';
function bubbles(){return Object.keys(colors).map(k=>`<span class="bubble" style="background:${colors[k]}">${k==='Ergebnis?'?'Welches Ergebnis?':k}</span>`).join('')}
function home(){mode='';app.innerHTML=`<div class="grid">${types.map(([id,ico,title,desc])=>`<button class="tile" data-mode="${id}"><span style="font-size:1.7rem">${ico}</span>${id==='connect'?'<span class="tag" style="float:right">🐻 Für unsere Bären · Klasse 4</span>':''}<strong>${title}</strong><small>${desc}</small></button>`).join('')}</div><section class="panel" style="margin-top:18px"><strong>Unser roter Faden</strong><div class="bubbles">${bubbles()}</div><p class="muted">Schreibe in der Er-/Sie-Form und im Präteritum. Beschreibe genau, vermeide Wiederholungen und verbinde Sätze sinnvoll.</p></section>`;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(b.dataset.mode));}
function start(id){mode=id;index=0;tries=0;selection=null;chosen=[];locked=false;feedback='';totalCorrect=0;phase='word';typed='';markSelected={};if(id==='write'){taskIndex=0;showWriting();return}if(id==='w'){questions=[...shuffle(wData).slice(0,5).map(x=>({kind:'choice',text:x[0],ask:x[1],answer:x[2],hint:x[3],options:shuffle([x[2],...shuffle(wData.filter(y=>y[1]===x[1]&&y[2]!==x[2])).slice(0,3).map(y=>y[2])])})),...shuffle(markData).slice(0,5).map(x=>({kind:'mark',...x}))];questions=shuffle(questions)}if(id==='order')questions=shuffle(orderData).slice(0,10).map(a=>({correct:a,parts:shuffle(a)}));if(id==='improve')questions=shuffle(improveData).slice(0,10).map(a=>({text:a[0],options:shuffle(a.slice(1,4)),answer:a[1],hint:a[5]}));if(id==='connect')questions=shuffle(connectData).slice(0,10).map(a=>({text:a[0],answer:a[1],solution:a[2],hint:a[3],options:shuffle([a[1],...shuffle(['und','aber','weil','denn','obwohl','während','bevor','anschließend','danach','deshalb'].filter(x=>x!==a[1])).slice(0,3)])}));if(id==='verbs')questions=shuffle(verbData).slice(0,10).map(v=>({inf:v[0],answer:v[1],kind:v[2]}));showQuestion()}
function frame(title,content){app.innerHTML=`<div class="no-print"><button class="btn secondary" onclick="home()">← Zur Startseite</button></div><section class="panel" style="margin-top:16px"><h2>${title}</h2>${content}</section>`}
function showQuestion(){tries=0;selection=null;chosen=[];locked=false;feedback='';phase='word';typed='';verbInput='';markSelected={};markColor='Wer?';renderQuestion()}
function renderQuestion(){const q=questions[index],name=types.find(t=>t[0]===mode)[2];let inner=`<div class="muted">Aufgabe ${index+1} von ${questions.length}</div><div class="progress"><div style="width:${index/questions.length*100}%"></div></div>`;
if(mode==='w'&&q.kind==='choice')inner+=`<p>Lies den Satz und finde die Antwort auf <strong>${escapeHTML(q.ask==='Ergebnis?'?'Welches Ergebnis?':q.ask)}</strong></p><div class="sentence">${escapeHTML(q.text)}</div>${renderChoices(q.options)}`;
if(mode==='w'&&q.kind==='mark')inner+=renderMark(q);
if(mode==='improve')inner+=`<p>Welche Formulierung passt am besten zu einem Veranstaltungsbericht?</p><div class="sentence">${escapeHTML(q.text)}</div>${renderChoices(q.options)}`;
if(mode==='connect')inner+=`<span class="tag">🐻 Für unsere Bären · Klasse 4</span><p><strong>Schritt 1:</strong> Wähle ein passendes Bindewort oder Verbindungswort.</p><div class="sentence">${escapeHTML(q.text)}</div>${renderChoices(q.options)}${selection!==null?`<p><strong>Schritt 2:</strong> Schreibe jetzt beide Aussagen als richtig verbundenen Satz bzw. als zwei Sätze mit dem Verbindungswort. Achte auf Komma, Punkt und Wortstellung.</p><textarea id="joined" rows="3" placeholder="Schreibe deinen Satz hier ..." oninput="typed=this.value;document.getElementById('check').disabled=!typed.trim()" ${locked?'disabled':''}>${escapeHTML(typed)}</textarea>`:''}`;
if(mode==='verbs')inner+=`<p>Setze das Verb in die <strong>1. Vergangenheit (Präteritum)</strong>. Schreibe nur die Form für <strong>er/sie/es</strong>.</p><div class="sentence">${escapeHTML(q.inf)} → er/sie/es …</div><input class="verb-input" id="verb" type="text" autocomplete="off" spellcheck="false" value="${escapeHTML(verbInput)}" placeholder="Präteritum-Form eingeben" oninput="verbInput=this.value;document.getElementById('check').disabled=!verbInput.trim()" ${locked?'disabled':''}><p class="muted">${q.kind==='regelmäßig'?'Dieses Verb wird regelmäßig gebildet.':q.kind==='unregelmäßig'?'Dieses Verb wird unregelmäßig gebildet.':'Achte besonders auf die Veränderung des Wortstamms.'}</p>`;
if(mode==='order')inner+=`<p>Bringe die fünf Sätze in die richtige Reihenfolge. Tippe sie nacheinander an. Du kannst deine Auswahl wieder zurücknehmen.</p><div class="slot">${chosen.length?chosen.map((x,i)=>`<button class="token" onclick="removeChosen(${i})">${i+1}. ${escapeHTML(x)} ×</button>`).join(''):'Hier erscheinen deine ausgewählten Sätze.'}</div><p class="muted">Noch nicht zugeordnet:</p><div class="tokens">${q.parts.filter(x=>!chosen.includes(x)).map(x=>`<button class="token" onclick="choosePart(${JSON.stringify(x).replace(/"/g,'&quot;')})">${escapeHTML(x)}</button>`).join('')}</div>`;
const canCheck=mode==='order'?chosen.length===5:mode==='w'&&q.kind==='mark'?Object.keys(markSelected).length>0:mode==='verbs'?!!verbInput.trim():mode==='connect'?selection!==null&&!!typed.trim():selection!==null;
inner+=`<div aria-live="polite">${feedback}</div><div class="actions"><button class="btn" id="check" onclick="checkAnswer()" ${locked||!canCheck?'disabled':''}>Antwort prüfen</button><button class="btn secondary ${locked?'':'hidden'}" onclick="nextQuestion()">${index===9?'Ergebnis ansehen':'Nächste Aufgabe →'}</button></div>`;frame(name,inner);}
function renderChoices(options){return `<div style="margin-top:18px">${options.map((s,i)=>`<button class="choice ${selection===i?'selected':''}" onclick="pick(${i})" ${locked?'disabled':''}>${escapeHTML(s)}</button>`).join('')}</div>`}
function renderMark(q){const spans=[];let pos=0;q.spans.forEach(([key,part],i)=>{const at=q.text.indexOf(part,pos);if(at<0)throw Error('Markierstelle fehlt: '+part);if(at>pos)spans.push({text:q.text.slice(pos,at),key:null});spans.push({text:part,key,id:i});pos=at+part.length});if(pos<q.text.length)spans.push({text:q.text.slice(pos),key:null});return `<p>Wähle eine Farbe und markiere die passenden Textstellen. Du kannst auch mehrere Stellen mit derselben Farbe markieren. <strong>Markiere alle sieben Informationen.</strong></p><div class="legend">${Object.keys(colors).map(k=>`<button class="colorpick ${markColor===k?'active':''}" style="--c:${colors[k]}" onclick="setMarkColor('${k}')">${k==='Ergebnis?'?'Welches Ergebnis?':k}</button>`).join('')}</div><div class="sentence marktext">${spans.map(z=>z.key===null?escapeHTML(z.text):`<button class="markspan" style="${markSelected[z.id]?'background:'+colors[markSelected[z.id]]:''}" onclick="markSpan(${z.id})" ${locked?'disabled':''}>${escapeHTML(z.text)}</button>`).join('')}</div><p class="muted">${Object.keys(markSelected).length} von ${q.spans.length} Textstellen markiert. Tippe auf eine bereits markierte Stelle, um die Farbe zu entfernen.</p>`}
function setMarkColor(k){markColor=k;renderQuestion()}
function markSpan(i){if(locked)return;if(markSelected[i]===markColor)delete markSelected[i];else markSelected[i]=markColor;renderQuestion()}
function pick(i){if(locked)return;selection=i;renderQuestion()}
function choosePart(x){if(locked||chosen.includes(x))return;chosen.push(x);renderQuestion()}
function removeChosen(i){if(locked)return;chosen.splice(i,1);renderQuestion()}
function norm(s){return String(s).toLocaleLowerCase('de-DE').replace(/\s+/g,' ').replace(/\s+([,.!?])/g,'$1').trim()}
function checkAnswer(){if(locked)return;const q=questions[index];if(mode==='connect'){const el=document.getElementById('joined');if(el)typed=el.value}if(mode==='verbs'){const el=document.getElementById('verb');if(el)verbInput=el.value}let answer=false,solution='',hint='';
if(mode==='order'){answer=JSON.stringify(chosen)===JSON.stringify(q.correct);solution=q.correct.map((x,i)=>(i+1)+'. '+x).join(' | ');hint='Achte auf die Reihenfolge der Ereignisse.'}
else if(mode==='w'&&q.kind==='mark'){answer=q.spans.every(([key],i)=>markSelected[i]===key);solution=q.spans.map(([key,part])=>`${key}: ${part}`).join(' | ');hint='Vergleiche die Farben der markierten Textstellen mit den W-Fragen.'}
else if(mode==='verbs'){answer=norm(verbInput)===norm(q.answer);solution=q.answer;hint=`${q.inf} → er/sie/es ${q.answer} (${q.kind})`}
else if(mode==='connect'){answer=q.options[selection]===q.answer&&norm(typed)===norm(q.solution);solution=q.solution;hint=q.hint}
else{answer=q.options[selection]===q.answer;solution=q.answer;hint=q.hint||''}
tries++;if(answer){totalCorrect++;locked=true;feedback=`<div class="feedback good"><strong>Richtig!</strong> ${escapeHTML(hint)}</div>`}else if(tries===1){let help=mode==='connect'?(q.options[selection]!==q.answer?'Prüfe zuerst, welches Bindewort inhaltlich passt.':'Das Bindewort passt. Kontrolliere nun die Wortstellung, die Großschreibung und die Satzzeichen.'):mode==='verbs'?'Denke an die besondere Präteritum-Form dieses Verbs.':mode==='w'&&q.kind==='mark'?'Prüfe, ob jede Textstelle die passende Farbe hat und alle Informationen markiert sind.':mode==='order'?'Beginne mit der Einleitung und beachte die zeitliche Reihenfolge.':mode==='w'?'Suche die Information, die zur W-Frage passt.':'Achte auf Sachlichkeit, Er-/Sie-Form und Präteritum.';feedback=`<div class="feedback bad"><strong>Noch nicht ganz richtig.</strong> ${help} Du hast noch einen Versuch.</div>`}else{locked=true;feedback=`<div class="feedback bad"><strong>Die Lösung:</strong> ${escapeHTML(solution)}<p>${escapeHTML(hint)}</p></div>`}renderQuestion()}
function nextQuestion(){if(index===9){frame('Übungsrunde abgeschlossen',`<p>Du hast alle zehn Aufgaben bearbeitet.</p><p><strong>${totalCorrect} von 10</strong> Aufgaben hast du spätestens beim zweiten Versuch richtig gelöst.</p><p class="muted">Du kannst jederzeit eine neue Runde mit anderen Aufgaben starten.</p><div class="actions"><button class="btn" onclick="start('${mode}')">Neue Aufgaben üben</button><button class="btn secondary" onclick="home()">Zur Startseite</button></div>`);return}index++;showQuestion()}
let taskIndex=0;function showWriting(){const t=writingTasks[taskIndex];frame('Mein eigener Veranstaltungsbericht',`<span class="tag">Freiwillige Schreibaufgabe · erfundene Veranstaltung</span><p>Schreibe einen Veranstaltungsbericht auf ein <strong>Blockblatt</strong>. Nutze die Stichpunkte und halte dich an den roten Faden.</p><div class="actions no-print"><button class="btn secondary" onclick="changeTask(-1)">← Andere Veranstaltung</button><button class="btn secondary" onclick="changeTask(1)">Nächste Veranstaltung →</button></div><h2 style="margin-top:22px">${t.icon} ${escapeHTML(t.title)}</h2>${t.facts.map(([a,b])=>`<div class="fact"><strong>${escapeHTML(a)}</strong>${escapeHTML(b)}</div>`).join('')}<h3>Dein Schreibauftrag</h3><p>Schreibe eine passende Überschrift und eine Einleitung mit den wichtigsten W-Fragen. Beschreibe im Hauptteil den Ablauf in der richtigen Reihenfolge. <strong>Bewerte im Schluss das Ergebnis und begründe deine Einschätzung.</strong> Verwende die Er-/Sie-Form und das Präteritum.</p><div class="actions no-print"><button class="btn secondary" onclick="window.print()">Aufgabe drucken</button></div><details><summary>Checkliste zur Selbstkontrolle anzeigen</summary>${['Meine Überschrift passt zur Veranstaltung.','Die Einleitung beantwortet Wer, Wann, Wo und Was.','Der Hauptteil beschreibt den Ablauf genau und in der richtigen Reihenfolge.','Im Schluss nenne ich das Ergebnis und bewerte es mit einer Begründung.','Ich schreibe überwiegend sachlich in der Er-/Sie-Form.','Ich verwende das Präteritum (1. Vergangenheit).','Ich verwende genaue Wörter und passende Adjektive.','Ich vermeide Wiederholungen und verbinde Sätze sinnvoll.','Ich kontrolliere Rechtschreibung und Satzzeichen.'].map(x=>`<label class="check"><input type="checkbox"> <span>${x}</span></label>`).join('')}</details><details><summary>Musterlösung zum Vergleichen anzeigen</summary><p class="muted">Das ist eine mögliche Lösung. Dein Bericht darf anders formuliert sein, wenn die Informationen stimmen.</p><div style="white-space:pre-line;line-height:1.8">${escapeHTML(t.sample.replaceAll('\\n','\n'))}</div></details>`)}
function changeTask(d){taskIndex=(taskIndex+d+writingTasks.length)%writingTasks.length;showWriting()}
home();
</script></body></html>
